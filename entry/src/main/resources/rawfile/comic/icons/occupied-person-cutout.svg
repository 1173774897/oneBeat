<svg width="22" height="22" viewBox="-3 -3 22 22" xmlns="http://www.w3.org/2000/svg">
  <title>已被其他队员选用</title>
  <!-- Match the existing 16 vp cutout glyph, 3 vp paper contour and 1 vp
       hard ink offset. The check distinguishes occupancy from entitlement. -->
  <g fill="#171B1F" stroke="#171B1F" stroke-width="3" stroke-linejoin="round" transform="translate(1 1)">
    <circle cx="6.1" cy="4.25" r="2.65"/>
    <path d="M0.8 14.1V11.8C0.8 9.65 4.35 8.4 6.1 8.4C7.85 8.4 11.4 9.65 11.4 11.8V14.1Z"/>
    <circle cx="12" cy="11.5" r="3.35"/>
  </g>
  <g fill="#FFFDF8" stroke="#FFFDF8" stroke-width="3" stroke-linejoin="round">
    <circle cx="6.1" cy="4.25" r="2.65"/>
    <path d="M0.8 14.1V11.8C0.8 9.65 4.35 8.4 6.1 8.4C7.85 8.4 11.4 9.65 11.4 11.8V14.1Z"/>
    <circle cx="12" cy="11.5" r="3.35"/>
  </g>
  <g fill="black">
    <circle cx="6.1" cy="4.25" r="2.65"/>
    <path d="M0.8 14.1V11.8C0.8 9.65 4.35 8.4 6.1 8.4C7.85 8.4 11.4 9.65 11.4 11.8V14.1Z"/>
  </g>
  <!-- The paper ring keeps the confirmation mark readable over the silhouette. -->
  <circle cx="12" cy="11.5" r="3.35" fill="black" stroke="#FFFDF8" stroke-width="1.3"/>
  <path d="M10.15 11.45L11.35 12.7L13.95 10.1" fill="none" stroke="#FFFDF8" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

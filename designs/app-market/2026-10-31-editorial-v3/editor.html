<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>互动手机底板 · 本地换屏</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#242831;background:#eeeae4;color-scheme:light}*{box-sizing:border-box}body{margin:0}main{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:100vh}aside{padding:30px 24px;background:#fffaf3;border-right:1px solid #ddd6cc}h1{font-size:22px;letter-spacing:-.6px;margin:0 0 9px}p{font-size:13px;line-height:1.65;color:#707078;margin:0 0 22px}fieldset{border:0;padding:0;margin:23px 0}legend,label{display:block;font-size:13px;font-weight:650;margin-bottom:10px}button{font:inherit;color:inherit;background:white;border:1px solid #cbc4bb;border-radius:9px;padding:10px 12px;min-height:42px;cursor:pointer}button:hover{border-color:#6f7580}button:disabled{opacity:.5;cursor:wait}.themes{display:grid;gap:7px}.themes button{text-align:left}.themes button[aria-pressed="true"],.row button[aria-pressed="true"]{background:#f0e6d8;border-color:#242831}.themes button[aria-pressed="true"]{box-shadow:inset 3px 0 #242831}.upload{padding:17px 12px;border:1px dashed #ada397;border-radius:10px;background:white;cursor:pointer}.upload input{font-size:11px;width:100%;margin-top:10px}.filename{font-size:11px;color:#77777d;overflow-wrap:anywhere;line-height:1.5}.row{display:flex;gap:8px}.row button{flex:1;font-size:13px}.download{width:100%;margin-top:12px;background:#242831;color:white;border-color:#242831;font-weight:650}.reset{width:100%;margin-top:9px;background:transparent}#status{font-size:12px;margin-top:15px;min-height:40px}.preview{display:flex;justify-content:center;align-items:flex-start;padding:26px}.stage{width:min(100%,470px)}.meta{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#6f7077;margin-bottom:12px}canvas{display:block;width:100%;height:auto;box-shadow:0 9px 35px #24283120}.note{text-align:center;font-size:12px;margin-top:13px}@media(max-width:760px){main{grid-template-columns:1fr}aside{padding:23px;border-right:0}.themes{grid-template-columns:repeat(2,minmax(0,1fr))}.preview{padding:12px 23px 24px}fieldset{margin:18px 0}}
</style>
</head>
<body>
<main>
<aside>
<h1>互动手机底板</h1>
<p>放入真实截图，保留人物握住手机的动作与手指。图片仅在当前浏览器中处理。</p>
<fieldset><legend>底板</legend><div id="themes" class="themes"></div></fieldset>
<label class="upload">选择本地截图<input id="upload" type="file" accept="image/*"></label>
<div id="filename" class="filename">尚未选择截图</div>
<fieldset><legend>截图铺放</legend><div class="row"><button id="contain" aria-pressed="true">完整显示</button><button id="cover" aria-pressed="false">填满屏幕</button></div></fieldset>
<button id="download" class="download">下载 PNG</button><button id="reset" class="reset">移除当前截图</button>
<p id="status" role="status" aria-live="polite">正在准备底板…</p>
</aside>
<section class="preview"><div class="stage"><div class="meta"><span id="name"></span><span id="size"></span></div><canvas id="canvas"></canvas><p class="note">截图只替换可见屏幕，压在屏幕边缘的手指会完整保留。</p></div></section>
</main>
<script id="template-bundle" type="application/json">{}</script>
<script>
'use strict';
const bundle=JSON.parse(document.getElementById('template-bundle').textContent);
const els=Object.fromEntries(['themes','upload','filename','contain','cover','download','reset','status','name','size','canvas'].map(id=>[id,document.getElementById(id)]));
const states=new Map(),images=new Map();
let config,currentId,generation=0,uploadGeneration=0,pendingUpload=false;
function loadImage(uri){if(!images.has(uri))images.set(uri,new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('无法读取这张图片，请重新选择。'));img.src=uri}));return images.get(uri)}
function canvas(width,height){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(width));c.height=Math.max(1,Math.ceil(height));return c}
function currentState(){return states.get(currentId)}
function drawFit(ctx,img,width,height,fit){const scale=(fit==='cover'?Math.max:Math.min)(width/img.naturalWidth,height/img.naturalHeight);const w=img.naturalWidth*scale,h=img.naturalHeight*scale;ctx.drawImage(img,(width-w)/2,(height-h)/2,w,h)}
function projectiveMap(q){
 const [p0,p1,p2,p3]=q;
 const dx1=p1.x-p2.x,dx2=p3.x-p2.x,dx3=p0.x-p1.x+p2.x-p3.x;
 const dy1=p1.y-p2.y,dy2=p3.y-p2.y,dy3=p0.y-p1.y+p2.y-p3.y;
 let g=0,h=0;
 if(Math.abs(dx3)+Math.abs(dy3)>1e-8){const det=dx1*dy2-dx2*dy1;if(Math.abs(det)<1e-8)throw new Error('屏幕四点无法构成有效投影。');g=(dx3*dy2-dx2*dy3)/det;h=(dx1*dy3-dx3*dy1)/det}
 const a=p1.x-p0.x+g*p1.x,b=p3.x-p0.x+h*p3.x,c=p0.x;
 const d=p1.y-p0.y+g*p1.y,e=p3.y-p0.y+h*p3.y,f=p0.y;
 return{affine:Math.abs(g)+Math.abs(h)<1e-8,at:(u,v)=>{const z=g*u+h*v+1;return{x:(a*u+b*v+c)/z,y:(d*u+e*v+f)/z}}};
}
function triangle(ctx,img,src,dst){
 const [s0,s1,s2]=src,[d0,d1,d2]=dst;
 const det=s0.x*(s1.y-s2.y)+s1.x*(s2.y-s0.y)+s2.x*(s0.y-s1.y);
 const coefficient=key=>[
  (d0[key]*(s1.y-s2.y)+d1[key]*(s2.y-s0.y)+d2[key]*(s0.y-s1.y))/det,
  (d0[key]*(s2.x-s1.x)+d1[key]*(s0.x-s2.x)+d2[key]*(s1.x-s0.x))/det,
  (d0[key]*(s1.x*s2.y-s2.x*s1.y)+d1[key]*(s2.x*s0.y-s0.x*s2.y)+d2[key]*(s0.x*s1.y-s1.x*s0.y))/det
 ];
 const [a,c,e]=coefficient('x'),[b,d,f]=coefficient('y');
 const center={x:(d0.x+d1.x+d2.x)/3,y:(d0.y+d1.y+d2.y)/3};
 // Adjacent triangles overlap by a subpixel so antialiasing cannot create seams.
 const expanded=dst.map(p=>{const length=Math.hypot(p.x-center.x,p.y-center.y)||1;return{x:p.x+(p.x-center.x)/length*.65,y:p.y+(p.y-center.y)/length*.65}});
 ctx.save();ctx.beginPath();ctx.moveTo(expanded[0].x,expanded[0].y);ctx.lineTo(expanded[1].x,expanded[1].y);ctx.lineTo(expanded[2].x,expanded[2].y);ctx.closePath();ctx.clip();ctx.setTransform(a,b,c,d,e,f);ctx.drawImage(img,0,0);ctx.restore();
}
function warp(ctx,plane,quad,settings){
 const map=projectiveMap(quad),w=plane.width,h=plane.height;
 if(map.affine){const p0=quad[0],p1=quad[1],p3=quad[3];ctx.save();ctx.setTransform((p1.x-p0.x)/w,(p1.y-p0.y)/w,(p3.x-p0.x)/h,(p3.y-p0.y)/h,p0.x,p0.y);ctx.drawImage(plane,0,0);ctx.restore();return}
 const columns=Math.max(4,Math.min(48,settings.meshColumns||20));
 const rows=Math.max(4,Math.min(64,settings.meshRows||Math.ceil(columns*h/w)));
 ctx.save();ctx.beginPath();quad.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.clip();
 for(let row=0;row<rows;row++)for(let col=0;col<columns;col++){
  const u0=col/columns,u1=(col+1)/columns,v0=row/rows,v1=(row+1)/rows;
  const src=[{x:u0*w,y:v0*h},{x:u1*w,y:v0*h},{x:u1*w,y:v1*h},{x:u0*w,y:v1*h}];
  const dst=[map.at(u0,v0),map.at(u1,v0),map.at(u1,v1),map.at(u0,v1)];
  triangle(ctx,plane,[src[0],src[1],src[2]],[dst[0],dst[1],dst[2]]);triangle(ctx,plane,[src[0],src[2],src[3]],[dst[0],dst[2],dst[3]]);
 }ctx.restore();
}
function syncControls(){const state=currentState();els.filename.textContent=state.filename||'尚未选择截图';for(const fit of['contain','cover'])els[fit].setAttribute('aria-pressed',String(state.fit===fit));for(const b of els.themes.children)b.setAttribute('aria-pressed',String(b.dataset.id===currentId))}
async function render(){
 const token=++generation,item=config.items.find(item=>item.id===currentId),state={...currentState()},geometry=bundle.geometries[currentId];
 const {width:W,height:H}=config.canvas;els.download.disabled=true;els.status.textContent='正在更新预览…';
 try{
  const [art,mask,shot]=await Promise.all([loadImage(bundle.images[item.id].artwork),loadImage(bundle.images[item.id].mask),state.image?loadImage(state.image):Promise.resolve(undefined)]);
  if(token!==generation)return false;
  const target=canvas(W,H),ctx=target.getContext('2d');ctx.imageSmoothingQuality='high';
  const t=geometry.transform;ctx.drawImage(art,t.x,t.y,t.width,t.height);
  if(shot){
   const plane=canvas(geometry.plane.width,geometry.plane.height),p=plane.getContext('2d');p.imageSmoothingQuality='high';p.fillStyle=item.screen.fill||config.screenFill||'#FFFCF7';p.fillRect(0,0,plane.width,plane.height);drawFit(p,shot,plane.width,plane.height,state.fit);
   const layer=canvas(W,H),l=layer.getContext('2d');l.imageSmoothingQuality='high';warp(l,plane,geometry.quad,item.screen);
   // Only the provided visible-screen mask may receive screenshot pixels.
   // The same final transform moves the artwork, phone, hands, mask and screenshot together.
   l.globalCompositeOperation='destination-in';l.drawImage(mask,0,0,W,H);l.globalCompositeOperation='source-over';
   ctx.drawImage(layer,t.x,t.y,t.width,t.height);
  }
  const visible=els.canvas.getContext('2d');visible.clearRect(0,0,W,H);visible.drawImage(target,0,0);
  els.name.textContent=item.id+' · '+item.name;els.download.disabled=pendingUpload;
  els.status.textContent=pendingUpload?'正在读取截图…':shot?'预览已更新，可以下载。':'底板已就绪，可以选择截图或直接下载。';return true;
 }catch(error){if(token===generation)els.status.textContent=error.message;return false}
}
function update(){syncControls();void render()}
function initialize(){
 if(!bundle.config||!bundle.images||!bundle.geometries){els.download.disabled=true;els.status.textContent='资源尚未打包，请运行 build.cjs 后重新打开。';return}
 config=bundle.config;currentId=config.items[0].id;els.canvas.width=config.canvas.width;els.canvas.height=config.canvas.height;els.size.textContent=config.canvas.width+' × '+config.canvas.height;
 for(const item of config.items){states.set(item.id,{image:null,filename:'',fit:'contain'});const b=document.createElement('button');b.dataset.id=item.id;b.textContent=item.id+' '+item.name;b.addEventListener('click',()=>{++uploadGeneration;pendingUpload=false;currentId=item.id;els.upload.value='';update()});els.themes.append(b)}
 for(const fit of['contain','cover'])els[fit].addEventListener('click',()=>{currentState().fit=fit;update()});
 els.upload.addEventListener('change',async()=>{
  const file=els.upload.files[0];if(!file)return;const token=++uploadGeneration,id=currentId;pendingUpload=true;els.download.disabled=true;els.status.textContent='正在读取截图…';
  try{const uri=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('无法读取这张截图。'));reader.readAsDataURL(file)});await loadImage(uri);if(token!==uploadGeneration||id!==currentId)return;pendingUpload=false;states.set(id,{...states.get(id),image:uri,filename:file.name});update()}
  catch(error){if(token===uploadGeneration){pendingUpload=false;els.download.disabled=false;els.status.textContent=error.message}}
 });
 els.reset.addEventListener('click',()=>{++uploadGeneration;pendingUpload=false;Object.assign(currentState(),{image:null,filename:''});els.upload.value='';update()});
 els.download.addEventListener('click',async()=>{if(pendingUpload)return;const id=currentId;if(!await render())return;els.canvas.toBlob(blob=>{if(!blob){els.status.textContent='导出失败，请重试。';return}const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='interaction-template-'+id+'.png';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);els.status.textContent='PNG 已下载。'},'image/png')});
 update();
}
initialize();
</script>
</body>
</html>
